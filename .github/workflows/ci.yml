name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Ruby quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Run the quality checks
        run: bin/check

  repeated_sequence_ui:
    name: Experimental cut review and signals
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: ui
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Install headless Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libopengl0

      - name: Install isolated Qt test dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/cut-review-tests"
          "$RUNNER_TEMP/cut-review-tests/bin/python" -m pip install PySide6-Essentials==6.8.3 numpy==2.3.5

      - name: Run the repeated-sequence review tests
        run: |
          "$RUNNER_TEMP/cut-review-tests/bin/python" -m unittest discover -s ui/tests -p 'test_repeated_sequence*.py'

      - name: Test cached capture signal diagnostics
        env:
          PYTHONPATH: script/research
        run: |
          "$RUNNER_TEMP/cut-review-tests/bin/python" -m unittest test_letterbox_signals test_capture_signal_audit test_source_discovery test_direct_motif_groups test_local_sequences
