name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Ruby quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install FFmpeg for path transport tests
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg

      - name: Run the quality checks
        run: bin/check

  manual_workflow_ui:
    name: Manual editing and encoding queue
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: ui
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Install headless editor dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libopengl0 ffmpeg python3-mlt python3-evdev python3-venv

      - name: Install isolated Qt test dependencies
        run: |
          /usr/bin/python3 -m venv --system-site-packages "$RUNNER_TEMP/manual-editor-tests"
          "$RUNNER_TEMP/manual-editor-tests/bin/python" -m pip install PySide6-Essentials==6.8.3

      - name: Run editor, project and queue unit tests
        run: |
          "$RUNNER_TEMP/manual-editor-tests/bin/python" -c "import mlt7, evdev; from PySide6 import QtWidgets"
          "$RUNNER_TEMP/manual-editor-tests/bin/python" -m unittest discover -s ui/tests -p 'test_*.py'
